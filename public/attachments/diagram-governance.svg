<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How the association is governed — owners elect five trustees; the trust maintains the common property; the City holds perpetual oversight</title>
  <rect width="900" height="560" fill="#fbfaf7"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44403a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a04f3f"/>
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d24">How the association is governed</text>
  <text x="450" y="61" text-anchor="middle" font-size="12.5" fill="#4a5a4e">From the recorded Declaration of Trust (Bk 34576 Pg 486) and Declaration of Covenants (Bk 34576 Pg 477)</text>

  <!-- owners box -->
  <rect x="70" y="90" width="360" height="86" rx="10" fill="#e8efe9" stroke="#2f6b4f" stroke-width="2"/>
  <text x="250" y="118" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2d24">16 lot owners</text>
  <text x="250" y="138" text-anchor="middle" font-size="12.5" fill="#33463a">automatic members — one vote per lot,</text>
  <text x="250" y="154" text-anchor="middle" font-size="12.5" fill="#33463a">an equal 6.25% share of costs and common property</text>

  <!-- trustees box -->
  <rect x="70" y="240" width="360" height="100" rx="10" fill="#d3e4d6" stroke="#2f6b4f" stroke-width="2"/>
  <text x="250" y="268" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2d24">5 trustees</text>
  <text x="250" y="288" text-anchor="middle" font-size="12.5" fill="#33463a">2-year terms · act by majority, quorum 3</text>
  <text x="250" y="304" text-anchor="middle" font-size="12.5" fill="#33463a">3 of 5 signatures = the trust's seal</text>
  <text x="250" y="324" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4a5a4e">appointments &amp; resignations effective when recorded at the Registry</text>

  <!-- elect arrow -->
  <line x1="250" y1="176" x2="250" y2="236" stroke="#44403a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="210" font-size="12.5" fill="#44403a">elect (majority)</text>

  <!-- amendment side arrow -->
  <path d="M74 176 C 30 210 30 300 66 322" fill="none" stroke="#44403a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="14" y="238" font-size="11.5" fill="#44403a" transform="rotate(-90 24 258)" text-anchor="middle"><tspan x="24" y="258">amend the trust: 75%</tspan></text>

  <!-- duties box -->
  <rect x="520" y="200" width="330" height="136" rx="10" fill="#f3efe6" stroke="#8a5a2b" stroke-width="2"/>
  <text x="685" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#3d2f1f">What the trust must maintain</text>
  <g font-size="12.5" fill="#4a4032">
    <text x="540" y="254">• the 20-ft emergency access to Ice House Lane</text>
    <text x="540" y="276">• the stormwater system, per the recorded O&amp;M plan</text>
    <text x="540" y="298">• Open Space Parcel C — 5.04 acres, preserved forever</text>
    <text x="540" y="320" font-style="italic">funded by equal assessments (lien + 12% if unpaid)</text>
  </g>

  <!-- maintain arrow -->
  <line x1="430" y1="290" x2="514" y2="290" stroke="#44403a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="472" y="280" font-size="12.5" fill="#44403a" text-anchor="middle">maintain</text>

  <!-- city box -->
  <rect x="520" y="440" width="330" height="86" rx="10" fill="#f6e8e4" stroke="#a04f3f" stroke-width="2"/>
  <text x="685" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#5a2d22">City of Beverly — perpetual oversight</text>
  <text x="685" y="488" text-anchor="middle" font-size="12" fill="#6b4038">if maintenance lapses: enter on 14 days' notice,</text>
  <text x="685" y="504" text-anchor="middle" font-size="12" fill="#6b4038">do the work, bill the association &amp; owners</text>
  <text x="685" y="520" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6b4038">Covenants Art. III — the City's judgment controls</text>

  <!-- city oversight arrow -->
  <line x1="685" y1="434" x2="685" y2="342" stroke="#a04f3f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="700" y="392" font-size="12" fill="#a04f3f">enforces</text>

  <!-- assessments arrow owners->duties -->
  <path d="M430 120 C 640 120 685 130 685 194" fill="none" stroke="#44403a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="640" y="112" font-size="12" fill="#44403a">pay assessments</text>

  <!-- registry note -->
  <rect x="70" y="440" width="360" height="86" rx="10" fill="#e6edf3" stroke="#4a6b90" stroke-width="2"/>
  <text x="250" y="468" text-anchor="middle" font-size="14.5" font-weight="700" fill="#22384f">The paper trail is public</text>
  <text x="250" y="488" text-anchor="middle" font-size="12" fill="#33475e">every founding instrument, amendment, and</text>
  <text x="250" y="504" text-anchor="middle" font-size="12" fill="#33475e">trustee change is recorded at the Southern Essex</text>
  <text x="250" y="520" text-anchor="middle" font-size="12" fill="#33475e">Registry of Deeds — and lives in this site's library</text>
  <line x1="250" y1="344" x2="250" y2="436" stroke="#4a6b90" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
