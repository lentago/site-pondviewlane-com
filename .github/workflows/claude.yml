# ============================================================================
# Claude Code — Interactive @claude Responder
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-responder.yml, matching
# the callers in every other active repo.
#
# Scope note: GITHUB_TOKEN cannot create or update files under
# .github/workflows/, so the responder can review, analyse and comment on CI
# here but cannot author it. Bash is scoped to the site's own build.
# ============================================================================

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, labeled]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, labeled, assigned]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: lentago/shared-workflows/.github/workflows/claude-responder.yml@main
    secrets: inherit
    with:
      allowed_tools: '"Bash(git add:*)" "Bash(git commit:*)" "Bash(git checkout:*)" "Bash(git switch:*)" "Bash(git push:*)" "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git branch:*)" "Bash(gh pr create:*)" "Bash(gh pr merge:*)" "Bash(gh pr view:*)" "Bash(gh issue view:*)" "Bash(npm ci:*)" "Bash(npm run build:*)" "Read" "Edit" "Write"'
