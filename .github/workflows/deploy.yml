# .github/workflows/deploy.yml
#
# Build & Deploy: the public Pond View Lane site (pondviewlane.com) and its
# sister skin (essexcrossingatmontserrat.com) -> ECR -> ECS Fargate (solidago
# platform). Both domains are live, public, and open to search engines; the
# pre-launch trustee-review preview and its site-wide noindex are long gone.
#
# Thin caller for the shared site-deploy reusable workflow. The full pipeline
# (full-history checkout, Astro build, Trivy scan, SLSA-v1 provenance
# attestation, ECS roll) lives in:
#   lentago/shared-workflows/.github/workflows/site-deploy.yml @ v1.1.1
#
# TWO-SKIN BUILD: npm run build (via package.json scripts) emits BOTH skins
# (dist-pondview/ + dist-essexcrossing/) in one pass — the two-domain logic
# lives in package.json, not in workflow YAML, by ADR-0004. The reusable's
# standard `npm run build` step faithfully reproduces this; no special wiring
# is needed here. The resulting nginx container serves each domain by Host
# header (nginx.conf, provisioned in solidago modules/site).
#
# fetch_depth: 0 preserves full git history so Starlight's lastUpdated dates
# reflect each source file's actual commit, not the deploy date.
#
# PUBLIC_ASK_ENDPOINT (Actions var) bakes the Ask Lambda URL into the client at
# build time via Astro's PUBLIC_ prefix; unset => Ask box degrades to passage
# search only.
#
# Resources: ECR repo solidago-dev-pondview, ECS cluster solidago-dev-cluster,
# ECS service solidago-dev-pondview, OIDC role solidago-dev-github-actions
# (trust uses this repo's immutable numeric subject — see solidago iam module).

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      id-token: write      # OIDC — AWS auth + attestation signing
      contents: read
      attestations: write  # store SLSA v1 build provenance in GitHub's attestation store
      packages: read       # required by actions/attest-build-provenance
    uses: lentago/shared-workflows/.github/workflows/site-deploy.yml@v1.2.2
    with:
      ecr_repo: solidago-dev-pondview
      ecs_cluster: solidago-dev-cluster
      ecs_service: solidago-dev-pondview
      role_arn: arn:aws:iam::365184644049:role/solidago-dev-github-actions
      aws_region: us-east-1
      node_version: "24"
      fetch_depth: 0
      build_env_vars: "PUBLIC_ASK_ENDPOINT=${{ vars.PUBLIC_ASK_ENDPOINT }}"
