# Shared server-context config for both domains (pondviewlane.com and
# essexcrossingatmontserrat.com). Each `server` block in nginx.conf sets its own
# listen / server_name / root / index and then `include`s this file, so the two
# Host-switched vhosts serve their own dist with identical routing, caching, and
# security headers — no drift between them.
#
# This file lives OUTSIDE /etc/nginx/conf.d (it is not a standalone server) — the
# Dockerfile copies it to /etc/nginx/nginx-common.conf. It is included INSIDE a
# server block, so `root` resolves to the including vhost's document root.

absolute_redirect off;

# Serve the site's styled 404 page (Astro emits <root>/404.html) instead of the
# bare nginx error page.
error_page 404 /404.html;

# NOTE: nginx add_header does NOT inherit into location blocks that set their own
# add_header — these two are repeated in those blocks below.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Clean URLs — Astro generates <route>/index.html
location / {
    try_files $uri $uri/ $uri/index.html =404;
}

# Retired sections (2026-07 public revamp): the wiki mirror and charts pages no
# longer exist — catch stale bookmarks.
location ~ ^/(wiki|charts)(/|$) {
    return 302 /;
}

# /guides/ has no landing page of its own (the guide list is the sidebar), so a
# bare visit would 403 on the directory. Send it — and the slashless form — to
# the Start-here guide so the path is a live 301, not a dead crawl target.
location = /guides/ { return 301 /guides/start-here/; }
location = /guides  { return 301 /guides/start-here/; }

# Health check endpoint for ALB target group. The check sends no meaningful Host
# header, so it lands on the default_server (pondview) vhost.
location /health {
    access_log off;
    return 200 'OK';
    add_header Content-Type text/plain;
}

# Library documents render inline in the embedded viewers. ^~ so this prefix
# beats the static-asset regex below — a recorded document can be re-extracted
# under the same filename, so library PDFs must revalidate within days, not sit
# in browser caches as immutable for a year.
location ^~ /library/ {
    add_header Content-Disposition inline;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Cache static assets
location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|pdf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Gzip
gzip on;
gzip_types text/html text/css application/javascript application/json image/svg+xml;
gzip_min_length 1000;
