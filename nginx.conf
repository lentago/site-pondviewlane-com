# Two domains, one container. This repo builds two visually distinct skins of the
# same content (see astro.config.mjs's SITE switch); nginx serves each from its
# own document root, selected by the request Host header.
#
# Both vhosts share their routing/caching/security config via nginx-common.conf
# (included below) so they can't drift — only listen / server_name / root differ.

# pondviewlane.com — the residents' entrance, and the default_server: any request
# without a matching Host (notably the ALB target-group health check, which sends
# no meaningful Host header) lands here and gets /health.
server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html/pondview;
    index index.html;

    include /etc/nginx/nginx-common.conf;
}

# essexcrossingatmontserrat.com — the subdivision's legal-name front door, same
# content, the estate skin. Live since the solidago ALB host rule started
# routing this Host to the container (lentago/solidago#138).
server {
    listen 8080;
    server_name essexcrossingatmontserrat.com;

    root /usr/share/nginx/html/essex;
    index index.html;

    include /etc/nginx/nginx-common.conf;
}

# www → apex, both domains. The ALB forwards www Hosts to this container rather
# than redirecting them, and the Ask Lambda's CORS allow-list holds only the
# apex origins — serving content on www would leave the Ask widget CORS-blocked
# there (and split search signals across two hosts). Redirecting keeps the apex
# canonical and the origin list short.
server {
    listen 8080;
    server_name www.pondviewlane.com;
    return 301 https://pondviewlane.com$request_uri;
}

server {
    listen 8080;
    server_name www.essexcrossingatmontserrat.com;
    return 301 https://essexcrossingatmontserrat.com$request_uri;
}
