server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Serve the site's styled 404 page (Astro emits dist/404.html) instead of
    # the bare nginx error page.
    error_page 404 /404.html;

    # NOTE: nginx add_header does NOT inherit into location blocks that set
    # their own add_header — these two are repeated in those blocks below.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Clean URLs — Astro generates <route>/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Retired sections (2026-07 public revamp): the wiki mirror and charts
    # pages no longer exist — catch stale bookmarks.
    location ~ ^/(wiki|charts)(/|$) {
        return 302 /;
    }

    # Health check endpoint for ALB target group
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Library documents render inline in the embedded viewers
    location /library/ {
        add_header Content-Disposition inline;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
