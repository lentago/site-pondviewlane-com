# Shared security-header set, `include`d from nginx-common.conf's server scope
# AND repeated inside every location block that declares its own add_header —
# nginx does NOT inherit add_header into a child scope that sets one of its
# own, so a location with a single add_header silently drops everything set
# above it. `include`ing this file re-adds the full set instead of relying on
# each location to remember to repeat it by hand.
#
# server_tokens is a normal (non add_header) directive and inherits fine, so
# it only needs to appear once per server{} block — declaring it again inside
# a location here is harmless (same value), not required.
server_tokens off;

# X-Frame-Options is SAMEORIGIN, not DENY: the library viewer embeds this
# site's own PDFs in a same-origin <iframe> (scripts/sync-content.mjs) — DENY
# would block that framing too, since it doesn't distinguish same-origin from
# cross-origin. frame-ancestors 'self' in the CSP below mirrors this.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Report-Only, not enforcing: this is a live public site with a client-side
# Ask call to a Lambda function URL, a Formspree-hosted report form, and
# Starlight/Ask's own inline scripts (no nonce infra yet) — an enforcing
# policy written without observing real traffic risks breaking one of them.
# 'unsafe-inline' covers the Ask widget's is:inline scripts (define:vars) and
# a couple of static inline style attributes; data: on img-src covers the
# Essex skin's ornament SVGs, which Vite inlines as base64 in the built CSS.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.lambda-url.us-east-1.on.aws; form-action 'self' https://formspree.io; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
