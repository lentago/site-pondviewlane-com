<!-- Embossed seal for the page footer: a gilt-ringed medallion carrying the same
     serrated range as the crest, over a rayed ground. Wordless by design — the
     site's anonymity rule and the no-copy-change constraint both rule out
     lettering, and a blank intaglio reads as a seal perfectly well. -->
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c46a"/>
      <stop offset=".45" stop-color="#b8912f"/>
      <stop offset="1" stop-color="#7a5c1e"/>
    </linearGradient>
    <clipPath id="sc"><circle cx="36" cy="36" r="23"/></clipPath>
  </defs>
  <!-- milled edge -->
  <g stroke="url(#s)" stroke-width="1.4">
    <circle cx="36" cy="36" r="33" fill="none"/>
    <circle cx="36" cy="36" r="29.5" fill="none" stroke-width="0.7" stroke-opacity=".8"/>
    <circle cx="36" cy="36" r="24" fill="none" stroke-width="0.7" stroke-opacity=".8"/>
  </g>
  <!-- rays between the rings -->
  <g stroke="url(#s)" stroke-width="1" stroke-opacity=".55">
    <path d="M36 6.5 V12 M36 60 V65.5 M6.5 36 H12 M60 36 H65.5"/>
    <path d="M15 15 L19 19 M57 15 L53 19 M15 57 L19 53 M57 57 L53 53"/>
  </g>
  <circle cx="36" cy="36" r="23" fill="#1c4031" fill-opacity=".14"/>
  <g clip-path="url(#sc)">
    <path d="M13 55 L19 41 L23 47 L28 36 L31 45 L36 38 L40 47 L45 36 L49 46 L54 40 L59 55 Z"
          fill="url(#s)"/>
  </g>
  <path d="M36 17 L37.4 21.4 L42 21.4 L38.3 24.2 L39.7 28.6 L36 25.9 L32.3 28.6 L33.7 24.2 L30 21.4 L34.6 21.4 Z"
        fill="url(#s)"/>
</svg>
