<!-- Corner boss, placed as four background layers on a single element. CSS cannot
     rotate an individual background layer, so this motif is drawn with true 4-fold
     rotational symmetry — it maps onto itself every 90° and therefore reads
     correctly in all four corners from one asset. Used on cards, stat medallions,
     figures and the Ask box. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="#b8912f">
    <!-- quatrefoil petals on the cardinal axes: wide control points keep them
         reading as rounded lobes rather than the thin cross they become when the
         curve hugs the axis -->
    <path d="M11 1.4 C14.6 4.6 14.6 7.6 11 9.6 C7.4 7.6 7.4 4.6 11 1.4 Z"/>
    <path d="M11 20.6 C14.6 17.4 14.6 14.4 11 12.4 C7.4 14.4 7.4 17.4 11 20.6 Z"/>
    <path d="M1.4 11 C4.6 7.4 7.6 7.4 9.6 11 C7.6 14.6 4.6 14.6 1.4 11 Z"/>
    <path d="M20.6 11 C17.4 7.4 14.4 7.4 12.4 11 C14.4 14.6 17.4 14.6 20.6 11 Z"/>
  </g>
  <circle cx="11" cy="11" r="2.4" fill="#c9a24b"/>
  <circle cx="11" cy="11" r="3.6" fill="none" stroke="#b8912f" stroke-width="0.6" stroke-opacity=".7"/>
</svg>
