<!-- 9-slice gilt picture frame, driven by CSS border-image (slice 32). The whole
     96×96 square is drawn as a literal frame: border-image cuts it into nine
     regions and maps each to the matching part of the box, so all four corners
     and all four edges have to exist here as real art. Edge bands repeat with
     `round`; corners are never stretched.

     Stroke weights are deliberately heavy. The frame renders at a border-width
     smaller than its 32px slice (22px on desktop, 10px on phones), so every
     stroke is scaled DOWN by that ratio — art drawn at hairline weight here
     disappears entirely on the page. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a22"/>
      <stop offset=".28" stop-color="#e3c46a"/>
      <stop offset=".5" stop-color="#f7ecc6"/>
      <stop offset=".72" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#7a5c1e"/>
    </linearGradient>
    <!-- corner: a solid bracket with a bevel highlight and a boss -->
    <g id="corner">
      <path d="M2 2 H30 V8 H8 V30 H2 Z" fill="url(#f)"/>
      <path d="M4.5 4.5 H27 V6 H6 V27 H4.5 Z" fill="#f7ecc6" fill-opacity=".55"/>
      <circle cx="15.5" cy="15.5" r="4.4" fill="url(#f)"/>
      <circle cx="15.5" cy="15.5" r="2" fill="#f7ecc6" fill-opacity=".7"/>
      <path d="M8 30 Q8 22 16 21" fill="none" stroke="url(#f)" stroke-width="2.2"/>
      <path d="M30 8 Q22 8 21 16" fill="none" stroke="url(#f)" stroke-width="2.2"/>
    </g>
  </defs>

  <!-- inner rule, run right around so the sliced edges all carry it -->
  <rect x="20" y="20" width="56" height="56" fill="none" stroke="url(#f)" stroke-width="3"/>

  <!-- edge bands: a beaded rail between the outer and inner rules -->
  <g fill="url(#f)">
    <rect x="32" y="2" width="32" height="6"/>
    <rect x="32" y="88" width="32" height="6"/>
    <rect x="2" y="32" width="6" height="32"/>
    <rect x="88" y="32" width="6" height="32"/>
    <!-- beads, centred in each edge slice so `round` repeats them evenly -->
    <circle cx="48" cy="14" r="3.4"/>
    <circle cx="48" cy="82" r="3.4"/>
    <circle cx="14" cy="48" r="3.4"/>
    <circle cx="82" cy="48" r="3.4"/>
  </g>
  <g fill="#f7ecc6" fill-opacity=".6">
    <circle cx="48" cy="14" r="1.4"/>
    <circle cx="48" cy="82" r="1.4"/>
    <circle cx="14" cy="48" r="1.4"/>
    <circle cx="82" cy="48" r="1.4"/>
  </g>

  <!-- four corners from one drawing, mirrored into place -->
  <use href="#corner"/>
  <g transform="translate(96,0) scale(-1,1)"><use href="#corner"/></g>
  <g transform="translate(0,96) scale(1,-1)"><use href="#corner"/></g>
  <g transform="translate(96,96) scale(-1,-1)"><use href="#corner"/></g>
</svg>
