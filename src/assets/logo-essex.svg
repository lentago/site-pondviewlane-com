<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Essex Crossing at Montserrat">
  <!-- Armorial achievement for the Essex Crossing skin: a gilt serrated range
       (Montserrat = "serrated mountain") on a deep estate-green shield, beneath a
       coronet, flanked by acanthus mantling, over a blank scroll. Kept in a 64×64
       square so it stays a drop-in replacement for the medallion it succeeds —
       Starlight sizes the nav logo by height, and the homepage hero renders it at
       roughly 128px, so the composition has to survive both. Detail is deliberately
       coarse: at nav size this reads as a gold-and-green mass, which is the point. -->
  <defs>
    <linearGradient id="ec-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f5318"/>
      <stop offset=".26" stop-color="#e3c46a"/>
      <stop offset=".48" stop-color="#f7ecc6"/>
      <stop offset=".7" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#7a5c1e"/>
    </linearGradient>
    <linearGradient id="ec-foil-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c46a"/>
      <stop offset=".55" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#8a6a22"/>
    </linearGradient>
    <linearGradient id="ec-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24523f"/>
      <stop offset="1" stop-color="#10271d"/>
    </linearGradient>
    <clipPath id="ec-shield">
      <path d="M32 16.5 L49 20 V37 Q49 49 32 56.5 Q15 49 15 37 V20 Z"/>
    </clipPath>
  </defs>

  <!-- acanthus mantling, flanking the shield -->
  <g fill="url(#ec-foil-v)" opacity="0.92">
    <path d="M15 22 Q6 25 4 33 Q8 29 11 31 Q5 35 6 42 Q10 36 13 38 Q11 43 14 47 Q13 39 16 34 Z"/>
    <path d="M49 22 Q58 25 60 33 Q56 29 53 31 Q59 35 58 42 Q54 36 51 38 Q53 43 50 47 Q51 39 48 34 Z"/>
  </g>

  <!-- scroll below -->
  <path d="M10 52 Q32 60 54 52 L54 57 Q32 64 10 57 Z" fill="url(#ec-foil-v)"/>
  <path d="M10 52 Q32 60 54 52" fill="none" stroke="#6f5318" stroke-opacity=".5" stroke-width="0.7"/>

  <!-- shield -->
  <path d="M32 16.5 L49 20 V37 Q49 49 32 56.5 Q15 49 15 37 V20 Z" fill="url(#ec-field)"/>
  <g clip-path="url(#ec-shield)">
    <!-- chief -->
    <path d="M15 16.5 H49 V25 H15 Z" fill="url(#ec-foil)" opacity=".92"/>
    <!-- estate star on the chief -->
    <path d="M32 17.4 L33.4 21.1 L37.4 21.1 L34.2 23.5 L35.4 27.3 L32 24.9 L28.6 27.3 L29.8 23.5 L26.6 21.1 L30.6 21.1 Z"
          fill="#10271d"/>
    <!-- serrated range -->
    <path d="M15 52 L20 38 L24 44 L28 33 L31 42 L34 35 L38 45 L42 34 L46 44 L49 38 L49 52 Z"
          fill="url(#ec-foil)"/>
    <path d="M15 52 L20 38 L24 44 L28 33 L31 42 L25 52 Z" fill="#8a6a22" opacity=".45"/>
  </g>
  <!-- shield outline, double-ruled -->
  <path d="M32 16.5 L49 20 V37 Q49 49 32 56.5 Q15 49 15 37 V20 Z"
        fill="none" stroke="url(#ec-foil-v)" stroke-width="1.6"/>
  <path d="M32 19 L46.6 22 V36.6 Q46.6 47 32 53.7 Q17.4 47 17.4 36.6 V22 Z"
        fill="none" stroke="#e3c46a" stroke-opacity=".55" stroke-width="0.6"/>

  <!-- coronet -->
  <g fill="url(#ec-foil-v)">
    <path d="M21 14.5 H43 V11.5 L38.5 13.5 L36 6.5 L32 11 L28 6.5 L25.5 13.5 L21 11.5 Z"/>
    <circle cx="32" cy="5" r="2"/>
    <circle cx="36.6" cy="5.6" r="1.5"/>
    <circle cx="27.4" cy="5.6" r="1.5"/>
  </g>
  <path d="M21 14.5 H43" fill="none" stroke="#6f5318" stroke-opacity=".55" stroke-width="0.6"/>
</svg>
